name: Update

on:
  # Runs at 10:00 UTC every day
  schedule:
    - cron:  '0 10 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: 🔄 Sync version with upstream
    environment: "Candidate Branch"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Sync version with upstream
        uses: snapcrafters/ci/sync-version@main
        with:
          token: ${{ secrets.SNAPCRAFTERS_BOT_COMMIT }}
          update-script: |
            set -eu

            # Update the snapcraft.yaml to match upstream version
            API="https://api.github.com/repos/jarun/ddgr/releases/latest"
            RELEASE=$(curl --fail --silent --show-error "${API}")
            TAG=$(printf '%s' "${RELEASE}" |
              jq -er '.tag_name | select(type == "string" and test("^v?[0-9]+(\\.[0-9]+)+$"))')
            VERSION=${TAG#v}
            sed -i 's/^\(version: \).*$/\1'"'$VERSION'"'/' snap/snapcraft.yaml
